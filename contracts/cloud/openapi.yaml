openapi: 3.1.0
info:
  title: AO Cloud Public API
  version: 1.0.0
  description: |
    Client-facing contract for a separate AO Cloud implementation. This
    repository does not serve these routes. The durable worker execution
    surface is included; provisioning, bootstrap, heartbeat, and raw transport
    protocols remain implementation-private.
security:
  - bearerAuth: []
tags:
  - name: Account
  - name: Agents
  - name: Projects
  - name: Sessions
  - name: GitHub
  - name: Pull Requests
  - name: Reviews
  - name: Events
  - name: Terminal
  - name: Workspace
  - name: Providers
  - name: Worker Execution
paths:
  /api/cloud/v1/me:
    get:
      operationId: getCurrentAccount
      tags: [Account]
      responses:
        "200":
          description: The authenticated user and their active organization memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAccount"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/agents:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listAgents
      tags: [Agents]
      responses:
        "200":
          description: Agent profiles supplied by the runtime and organization host.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [agents]
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentProfile"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/projects:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listProjects
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of projects in the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProject
      tags: [Projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectInput"
      responses:
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/installations:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listGitHubInstallations
      tags: [GitHub]
      responses:
        "200":
          description: GitHub App installations connected to the organization.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [installations]
                properties:
                  installations:
                    type: array
                    items:
                      $ref: "#/components/schemas/GitHubInstallation"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/installations/start:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: startGitHubInstallation
      tags: [GitHub]
      responses:
        "201":
          description: A short-lived GitHub App installation attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubInstallationStart"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/installations/{installationId}/sync:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InstallationId"
    post:
      operationId: syncGitHubInstallation
      tags: [GitHub]
      responses:
        "202":
          description: Repository synchronization accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [installation]
                properties:
                  installation:
                    $ref: "#/components/schemas/GitHubInstallation"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/installations/{installationId}/disconnect:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/InstallationId"
    post:
      operationId: disconnectGitHubInstallation
      tags: [GitHub]
      responses:
        "200":
          description: The GitHub App installation was disconnected from AO.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [installation]
                properties:
                  installation:
                    $ref: "#/components/schemas/GitHubInstallation"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/repositories:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listGitHubRepositories
      tags: [GitHub]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of repositories currently or historically granted to the organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubRepositoryPage"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/github/projects:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    post:
      operationId: createProjectFromGitHub
      tags: [GitHub, Projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGitHubProjectInput"
      responses:
        "201":
          description: Project created from an actively granted GitHub repository.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [project]
                properties:
                  project:
                    $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listSessions
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: projectId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: A page of sessions in the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPage"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createSession
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionInput"
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSession
      tags: [Sessions]
      responses:
        "200":
          description: Session details.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/pull-requests:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listSessionPullRequests
      tags: [Pull Requests]
      responses:
        "200":
          description: Normalized provider pull-request observations for the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPullRequests"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/reviews:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSessionReviewState
      tags: [Reviews]
      responses:
        "200":
          description: AO review planning state and recorded runs for the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionReviewState"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/messages:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: sendMessage
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 65536
      responses:
        "202":
          description: Message accepted and durably appended.
          content:
            application/json:
              schema:
                type: object
                required: [event]
                properties:
                  event:
                    $ref: "#/components/schemas/UserMessageEvent"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/turns/{turnId}/cancel:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/TurnId"
    post:
      operationId: cancelTurn
      tags: [Sessions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Cancellation was durably requested for the turn.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [turn]
                properties:
                  turn:
                    $ref: "#/components/schemas/Turn"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/chat-events:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: replayClientEvents
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/EventLimit"
      responses:
        "200":
          description: Client-visible events after the supplied sequence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientEventPage"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/events:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: streamClientEvents
      tags: [Events]
      parameters:
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: |
            Replay followed by live client-visible events. Each SSE data field
            contains a ClientEvent; the SSE id is its sequence.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/terminal-ticket:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    post:
      operationId: createTerminalTicket
      tags: [Terminal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  $ref: "#/components/schemas/TerminalKind"
      responses:
        "201":
          description: Short-lived, single-use terminal access ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalTicket"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/terminal:
    get:
      operationId: connectTerminal
      tags: [Terminal]
      summary: Upgrade to a terminal WebSocket using a short-lived ticket.
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema:
            type: string
        - name: after
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 9007199254740991
            default: 0
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/TerminalKind"
      responses:
        "101":
          description: WebSocket protocol upgrade accepted.
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/workspace/files:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listWorkspaceFiles
      tags: [Workspace]
      parameters:
        - name: path
          in: query
          schema:
            type: string
            default: ""
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of entries in a workspace directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceEntryPage"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/workspace/file:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: readWorkspaceFile
      tags: [Workspace]
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: UTF-8 workspace file contents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceFile"
        default:
          $ref: "#/components/responses/Error"
    put:
      operationId: writeWorkspaceFile
      tags: [Workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceFileWriteInput"
      responses:
        "200":
          description: The updated UTF-8 workspace file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceFile"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/sessions/{sessionId}/workspace/diff:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getWorkspaceDiff
      tags: [Workspace]
      responses:
        "200":
          description: Workspace changes relative to the session compare base.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDiff"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/provider-connections:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      operationId: listProviderConnections
      tags: [Providers]
      responses:
        "200":
          description: Redacted provider connection metadata. Secrets are never returned.
          content:
            application/json:
              schema:
                type: object
                required: [providerConnections]
                properties:
                  providerConnections:
                    type: array
                    items:
                      $ref: "#/components/schemas/RedactedProviderConnection"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/orgs/{orgId}/provider-connections/agents/{provider}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [claude-code, codex, cursor]
    put:
      operationId: putAgentProviderConnection
      tags: [Providers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutAgentProviderConnectionInput"
      responses:
        "200":
          description: The validated coding-agent credential was encrypted and stored.
          content:
            application/json:
              schema:
                type: object
                required: [providerConnection]
                properties:
                  providerConnection:
                    $ref: "#/components/schemas/RedactedProviderConnection"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteAgentProviderConnection
      tags: [Providers]
      responses:
        "204":
          description: The coding-agent credential was disconnected.
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/turns/lease:
    post:
      operationId: leaseWorkerTurn
      tags: [Worker Execution]
      security:
        - workerAuth: []
      parameters:
        - name: waitSeconds
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 30
            default: 0
      responses:
        "200":
          description: A fenced lease for the next queued turn owned by this worker's session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerTurnLease"
        "204":
          description: No turn is currently available.
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/turns/{turnId}/result:
    parameters:
      - $ref: "#/components/parameters/TurnId"
    post:
      operationId: submitWorkerTurnResult
      tags: [Worker Execution]
      security:
        - workerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerTurnResultInput"
      responses:
        "202":
          description: The fenced turn result was durably recorded.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [turn]
                properties:
                  turn:
                    $ref: "#/components/schemas/Turn"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/turns/{turnId}/cancel:
    parameters:
      - $ref: "#/components/parameters/TurnId"
    get:
      operationId: getWorkerTurnCancellation
      tags: [Worker Execution]
      security:
        - workerAuth: []
      parameters:
        - name: leaseId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Current durable cancellation state for the leased turn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerTurnCancellation"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/credentials/agent:
    get:
      operationId: getWorkerAgentCredential
      tags: [Worker Execution]
      security:
        - workerAuth: []
      responses:
        "200":
          description: The session-scoped coding-agent credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerAgentCredential"
        default:
          $ref: "#/components/responses/Error"
  /api/cloud/v1/worker/scm/checkout-grant:
    post:
      operationId: createWorkerSCMCheckoutGrant
      tags: [Worker Execution]
      security:
        - workerAuth: []
      responses:
        "201":
          description: A short-lived grant for cloning and pushing the session repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SCMCheckoutGrant"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    workerAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Session-scoped worker credential formatted as `Worker <token>`.
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TurnId:
      name: turnId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InstallationId:
      name: installationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    EventLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    After:
      name: after
      in: query
      description: Return events with a sequence strictly greater than this value.
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 9007199254740991
        default: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Reusing a key with the same command returns the original result.
        Reusing it with a different command returns an IDEMPOTENCY_CONFLICT.
      schema:
        type: string
        minLength: 1
        maxLength: 200
  responses:
    Error:
      description: Standard Cloud API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    AuthProvider:
      type: string
      enum: [workos, local]
    OrganizationRole:
      type: string
      enum: [owner, admin, member]
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, email, displayName, authProvider]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        authProvider:
          $ref: "#/components/schemas/AuthProvider"
    OrganizationMembership:
      type: object
      additionalProperties: false
      required: [id, slug, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{1,62}$"
        displayName:
          type: string
        role:
          $ref: "#/components/schemas/OrganizationRole"
    CurrentAccount:
      type: object
      additionalProperties: false
      required: [user, organizations]
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMembership"
    AgentCapability:
      type: string
      enum:
        - interface.chat
        - interface.tui
        - model.catalog
        - model.custom
        - attachments
        - browser.preview
        - review.execute
        - session.resume
    AgentInstallationState:
      type: string
      enum: [installed, not_installed, unknown, not_applicable]
    AgentAuthenticationState:
      type: string
      enum: [authorized, unauthorized, unknown, not_applicable]
    AgentOrganizationPolicy:
      type: string
      enum: [not_applicable, allowed, denied]
    AgentAvailability:
      type: object
      additionalProperties: false
      required: [available, installation, authentication, organizationPolicy]
      properties:
        available:
          type: boolean
          description: Effective host readiness after installation, authentication, and organization policy.
        installation:
          $ref: "#/components/schemas/AgentInstallationState"
        authentication:
          $ref: "#/components/schemas/AgentAuthenticationState"
        organizationPolicy:
          $ref: "#/components/schemas/AgentOrganizationPolicy"
        reason:
          type: string
          description: Host-supplied explanation when the agent is unavailable.
    AgentProfile:
      type: object
      additionalProperties: false
      required: [id, label, capabilities, availability]
      properties:
        id:
          type: string
        label:
          type: string
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/AgentCapability"
        availability:
          $ref: "#/components/schemas/AgentAvailability"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error, code, message, requestId]
      properties:
        error:
          type: string
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
    PageInfo:
      type: object
      additionalProperties: false
      required: [hasMore]
      properties:
        hasMore:
          type: boolean
        nextCursor:
          type: string
    Project:
      type: object
      additionalProperties: false
